language: pt-BR

calendar:
  # Vazio = primeiro mundo do Overworld carregado.
  world: ""

seasons:
  transition-announcement:
    enabled: true

climate:
  weather-events:
    player-announcements: true
    clear-duration-seconds: 600
    precipitation-duration-seconds: 300
    storm-duration-seconds: 180
  thermal-runtime:
    # Mantém estado corporal interno; feedback visual é módulo separado e dano não existe ainda.
    enabled: true
    # 20 ticks = 1 s. A simulação usa elapsed real e catch-up bounded.
    update-period-ticks: 20
  thermal-feedback:
    # Fallbacks visuais vanilla; nenhum deles aplica dano ou freeze ticks.
    enabled: true
    # 10 ticks = 0,5 s. Não repete probes ambientais; usa profile cacheado.
    update-period-ticks: 10
    cold-breath:
      enabled: true
    frost:
      enabled: true

companions:
  datapack:
    # Verifica somente um datapack já instalado antes do startup do plugin.
    enabled: false
    paper-name: ""
    required: false
  resource-pack:
    # Desligado até existir artifact/hosting configurado.
    enabled: false
    url: ""
    # SHA-1 de 40 caracteres exigido pelo protocolo Minecraft; não é o SHA-256 do manifest.
    sha1: ""
    required: false
    prompt: "Living World environmental visuals"

desire-lines:
  enabled: true
  grass-to-dirt-visits: 12
  dirt-to-path-visits: 24
  max-tracked-positions-per-chunk: 512
  flush-period-ticks: 200

qol:
  double-doors:
    enabled: true

waystones:
  enabled: true
  anchor-material: LODESTONE
  # Renomear exige estar fisicamente próximo da âncora.
  rename-max-distance: 6.0

discovery:
  presentation:
    # Desligar apenas oculta o momento; o registro da descoberta continua correto.
    enabled: true

hud:
  enabled: true
  # 10 ticks = 0,5 s. A action bar precisa ser renovada para permanecer visível.
  update-period-ticks: 10
  calendar-boss-bar:
    enabled: true
  action-bar:
    navigation: true
    coordinates: true
    temperature: true

ecology:
  natural-growth:
    enabled: true
    # 0 = crescimento vanilla; 1 = efeito climático completo.
    # Árvores usam força menor porque já tentam crescer com menos frequência.
    crop-strength: 0.65
    tree-strength: 0.35
  ground-cover-spread:
    enabled: true
    # Modula apenas DIRT -> GRASS_BLOCK causado por GRASS_BLOCK natural.
    strength: 0.50
  farmland-moisture-retention:
    enabled: true
    # Só pode atrasar secagem vanilla; nunca hidrata ou seca artificialmente.
    strength: 0.70
  fire-spread:
    enabled: true
    # Só modula BlockIgniteEvent com causa SPREAD.
    strength: 0.65
  frozen-surfaces:
    enabled: true
  physical-winter:
    # Mutação ativa de WATER <-> ICE permanece opt-in até smoke runtime.
    enabled: false
    update-period-ticks: 40
    probes-per-player: 4
    max-mutations-per-player: 1
    radius-blocks: 8
    freeze-at-or-below-celsius: -1.0
    thaw-at-or-above-celsius: 2.0
    max-owned-positions-per-chunk: 256
    max-snow-layers: 4
